<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <!-- Background -->
  <rect width="1080" height="1080" fill="#0a0c10"/>
  <radialGradient id="g1" cx="50%" cy="40%" r="60%">
    <stop offset="0%" stop-color="#161820"/>
    <stop offset="100%" stop-color="#0a0c10"/>
  </radialGradient>
  <rect width="1080" height="1080" fill="url(#g1)"/>

  <!-- Stars -->
  <circle cx="80" cy="60" r="1.5" fill="#f0ebe4" opacity="0.35"/>
  <circle cx="250" cy="30" r="1" fill="#f0ebe4" opacity="0.2"/>
  <circle cx="420" cy="75" r="1.3" fill="#f0ebe4" opacity="0.25"/>
  <circle cx="600" cy="40" r="0.9" fill="#f0ebe4" opacity="0.3"/>
  <circle cx="780" cy="65" r="1.4" fill="#f0ebe4" opacity="0.15"/>
  <circle cx="950" cy="45" r="1.1" fill="#f0ebe4" opacity="0.25"/>
  <circle cx="1030" cy="90" r="0.8" fill="#f0ebe4" opacity="0.2"/>
  <circle cx="150" cy="180" r="0.7" fill="#f0ebe4" opacity="0.15"/>
  <circle cx="350" cy="200" r="1.2" fill="#f0ebe4" opacity="0.1"/>
  <circle cx="700" cy="160" r="0.9" fill="#f0ebe4" opacity="0.2"/>
  <circle cx="900" cy="190" r="1.3" fill="#f0ebe4" opacity="0.12"/>
  <circle cx="50" cy="350" r="1" fill="#f0ebe4" opacity="0.18"/>
  <circle cx="1020" cy="400" r="0.8" fill="#f0ebe4" opacity="0.15"/>
  <circle cx="100" cy="700" r="1.1" fill="#f0ebe4" opacity="0.12"/>
  <circle cx="980" cy="650" r="0.9" fill="#f0ebe4" opacity="0.1"/>
  <circle cx="200" cy="900" r="1.3" fill="#f0ebe4" opacity="0.15"/>
  <circle cx="500" cy="950" r="0.8" fill="#f0ebe4" opacity="0.1"/>
  <circle cx="800" cy="920" r="1" fill="#f0ebe4" opacity="0.12"/>
  <circle cx="1000" cy="850" r="0.7" fill="#f0ebe4" opacity="0.18"/>
  <circle cx="60" cy="500" r="0.9" fill="#f0ebe4" opacity="0.1"/>
  <circle cx="1050" cy="550" r="1.1" fill="#f0ebe4" opacity="0.08"/>
  <circle cx="300" cy="1030" r="1" fill="#f0ebe4" opacity="0.1"/>
  <circle cx="700" cy="1050" r="0.8" fill="#f0ebe4" opacity="0.12"/>

  <!-- Large breathing orb -->
  <radialGradient id="orb" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="rgba(212,168,83,0.06)"/>
    <stop offset="50%" stop-color="rgba(212,168,83,0.03)"/>
    <stop offset="100%" stop-color="transparent"/>
  </radialGradient>
  <circle cx="540" cy="460" r="350" fill="url(#orb)"/>
  <circle cx="540" cy="460" r="280" fill="none" stroke="rgba(212,168,83,0.04)" stroke-width="0.8"/>
  <circle cx="540" cy="460" r="200" fill="none" stroke="rgba(212,168,83,0.03)" stroke-width="0.8"/>
  <circle cx="540" cy="460" r="120" fill="none" stroke="rgba(212,168,83,0.025)" stroke-width="0.8"/>

  <!-- Film grain -->
  <pattern id="grain" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect x="0" y="0" width="1" height="1" fill="rgba(240,235,228,0.007)"/>
    <rect x="2" y="2" width="1" height="1" fill="rgba(240,235,228,0.004)"/>
  </pattern>
  <rect width="1080" height="1080" fill="url(#grain)"/>

  <!-- Top accent -->
  <linearGradient id="topLine" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="transparent"/>
    <stop offset="30%" stop-color="#d4a853" stop-opacity="0.25"/>
    <stop offset="70%" stop-color="#d4a853" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="transparent"/>
  </linearGradient>
  <rect x="0" y="0" width="1080" height="3" fill="url(#topLine)"/>

  <!-- Brand -->
  <text x="540" y="260" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#7d9b8a" letter-spacing="5" font-weight="400" text-anchor="middle">SUPERTHOUGHTS</text>

  <!-- Amber dash -->
  <rect x="515" y="280" width="50" height="2" rx="1" fill="#d4a853" opacity="0.6"/>

  <!-- Main headline -->
  <text x="540" y="380" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#f0ebe4" font-weight="400" text-anchor="middle">Fall asleep.</text>
  <text x="540" y="470" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#f0ebe4" font-weight="400" text-anchor="middle">Stay asleep.</text>
  <text x="540" y="570" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#d4a853" font-weight="400" font-style="italic" text-anchor="middle">Wake up rested.</text>

  <!-- Subtitle -->
  <text x="540" y="640" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#a09994" font-weight="300" text-anchor="middle">An 8-session guided sleep program</text>
  <text x="540" y="672" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#a09994" font-weight="300" text-anchor="middle">grounded in clinical research.</text>

  <!-- Divider -->
  <linearGradient id="divider" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="transparent"/>
    <stop offset="30%" stop-color="rgba(240,235,228,0.08)"/>
    <stop offset="70%" stop-color="rgba(240,235,228,0.08)"/>
    <stop offset="100%" stop-color="transparent"/>
  </linearGradient>
  <rect x="200" y="710" width="680" height="1" fill="url(#divider)"/>

  <!-- Stats -->
  <text x="310" y="770" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#d4a853" letter-spacing="1.5" font-weight="500" text-anchor="middle">25+ YEARS PRACTICE</text>
  <circle cx="455" cy="766" r="1.5" fill="#5c5651"/>
  <text x="540" y="770" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#7d9b8a" letter-spacing="1.5" font-weight="500" text-anchor="middle">4.8 / 5</text>
  <circle cx="615" cy="766" r="1.5" fill="#5c5651"/>
  <text x="760" y="770" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#b8929a" letter-spacing="1.5" font-weight="500" text-anchor="middle">CLINICALLY GROUNDED</text>

  <!-- CTA -->
  <rect x="390" y="830" width="300" height="48" rx="4" fill="none" stroke="#d4a853" stroke-width="1" opacity="0.5"/>
  <text x="540" y="860" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#d4a853" letter-spacing="2.5" font-weight="500" text-anchor="middle">FREE SESSION INSIDE</text>

  <!-- Bottom line -->
  <linearGradient id="botLine" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="transparent"/>
    <stop offset="30%" stop-color="#d4a853" stop-opacity="0.2"/>
    <stop offset="70%" stop-color="#d4a853" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="transparent"/>
  </linearGradient>
  <rect x="0" y="1076" width="1080" height="4" fill="url(#botLine)"/>

  <!-- Small logo mark bottom -->
  <text x="540" y="1010" font-family="Georgia, 'Times New Roman', serif" font-size="36" fill="#d4a853" font-style="italic" font-weight="400" text-anchor="middle" opacity="0.2">S</text>
</svg>
